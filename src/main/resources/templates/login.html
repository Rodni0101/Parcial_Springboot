<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Iniciar sesión · SpringStore</title>
        <link rel="stylesheet" th:href="@{/css/auth.css}" />
    </head>
    <body>
        <main class="auth-card">
            <div class="brand">
                <img th:src="@{/favicon.svg}" alt="" />
                <span>
                    Spring
                    <span>Store</span>
                </span>
            </div>
            <p class="eyebrow">BIENVENIDO</p>
            <h1>Inicia sesión</h1>
            <p class="subtitle">Accede a tu catálogo de productos.</p>
            <p class="message error" th:if="${param.error}">Nombre de usuario o contraseña incorrectos.</p>
            <p class="message success" th:if="${param.logout}">Sesión cerrada correctamente.</p>
            <p class="message success" th:if="${exito}" th:text="${exito}"></p>
            <form th:action="@{/login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <label for="username">Nombre de usuario</label>
                <input id="username" name="username" type="text" placeholder="Tu nombre de usuario" required autofocus />
                <label for="password">Contraseña</label>
                <div class="password-field">
                    <input id="password" name="password" type="password" placeholder="Tu contraseña" required />
                    <button class="toggle-password" type="button" data-password-target="password">Mostrar</button>
                </div>
                <button type="submit">Entrar</button>
            </form>
            <p class="switch">
                ¿No tienes cuenta?
                <a th:href="@{/registro}">Regístrate</a>
            </p>
        </main>
        <script th:src="@{/js/password-toggle.js}"></script>
    </body>
</html>
