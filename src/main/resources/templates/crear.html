<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/crear.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <script th:src="@{/js/theme-toggle.js}"></script>
</head>
<body>
    <nav class="form-topbar">
        <a class="form-brand" th:href="@{/}">
            <span class="form-brand-mark"><img th:src="@{/favicon.svg}" alt=""></span>
            <span>Spring<span>Store</span></span>
        </a>
        <button class="form-theme-toggle theme-toggle" id="themeToggle" type="button"
                aria-label="Cambiar a tema oscuro" title="Cambiar a tema oscuro">
            <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20.2 15.4A8.7 8.7 0 0 1 8.6 3.8 8.8 8.8 0 1 0 20.2 15.4Z"/>
            </svg>
            <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="4"/>
                <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>
            </svg>
            <span class="theme-label">Tema oscuro</span>
        </button>
    </nav>
    <main class="page">
        <a class="back-link" th:href="@{/}">← Volver al inventario</a>

        <section class="form-card">
            <header class="form-header">
                <p class="eyebrow">INVENTARIO</p>
                <h1>Agregar producto</h1>
                <p>Completa los datos para añadir un producto a tu inventario.</p>
            </header>

            <p class="form-error" role="alert" th:if="${error}" th:text="${error}"></p>

            <form th:action="@{/Crear}" th:object="${producto}" method="post" enctype="multipart/form-data">
                <div class="form-grid">
                    <div class="form-field">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" th:field="*{nombre}" placeholder="Ej. Cuaderno universitario" required>
                    </div>

                    <div class="form-field">
                        <label for="categoria">Categoría</label>
                        <input type="text" id="categoria" th:field="*{categoria}" placeholder="Ej. Papelería" required>
                    </div>

                    <div class="form-field">
                        <label for="precio">Precio</label>
                        <input type="number" id="precio" th:field="*{precio}" min="0" step="0.01" placeholder="0.00" required>
                    </div>

                    <div class="form-field">
                        <label for="cantidadDisponible">Cantidad disponible</label>
                        <input type="number" id="cantidadDisponible" th:field="*{cantidadDisponible}" min="0" step="1" placeholder="0" required>
                    </div>

                    <div class="form-field form-field-full">
                        <label for="descripcion">Descripción <span>(opcional)</span></label>
                        <textarea id="descripcion" th:field="*{descripcion}" rows="4" placeholder="Agrega algún detalle sobre el producto"></textarea>
                    </div>

                    <div class="form-field form-field-full">
                        <label for="archivoImagen">Imagen del producto</label>
                        <input type="file" id="archivoImagen" name="archivoImagen" accept="image/jpeg,image/png,image/gif" required>
                        <small>Formatos permitidos: JPG, PNG o GIF. Tamaño máximo: 5 MB.</small>
                    </div>
                </div>

                <div class="form-actions">
                    <a class="button button-secondary" th:href="@{/}">Cancelar</a>
                    <button class="button button-primary" type="submit">Guardar producto</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
