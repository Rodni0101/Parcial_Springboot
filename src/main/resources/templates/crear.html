<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear producto</title>
    <link rel="stylesheet" th:href="@{/css/crear.css}">
</head>
<body>
    <main class="page">
        <a class="back-link" th:href="@{/}">← Volver al inventario</a>

        <section class="form-card">
            <header class="form-header">
                <p class="eyebrow">INVENTARIO</p>
                <h1>Agregar producto</h1>
                <p>Completa los datos para añadir un producto a tu inventario.</p>
            </header>

            <form th:action="@{/Crear}" th:object="${producto}" method="post">
                <div class="form-grid">
                    <div class="form-field">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" th:field="*{nombre}" placeholder="Ej. Cuaderno universitario" required>
                    </div>

                    <div class="form-field">
                        <label for="categoria">Categoría</label>
                        <input type="text" id="categoria" th:field="*{categoria}" placeholder="Ej. Papelería" required>
                    </div>

                    <div class="form-field">
                        <label for="precio">Precio</label>
                        <input type="number" id="precio" th:field="*{precio}" min="0" step="0.01" placeholder="0.00" required>
                    </div>

                    <div class="form-field">
                        <label for="cantidadDisponible">Cantidad disponible</label>
                        <input type="number" id="cantidadDisponible" th:field="*{cantidadDisponible}" min="0" step="1" placeholder="0" required>
                    </div>

                    <div class="form-field form-field-full">
                        <label for="descripcion">Descripción <span>(opcional)</span></label>
                        <textarea id="descripcion" th:field="*{descripcion}" rows="4" placeholder="Agrega algún detalle sobre el producto"></textarea>
                    </div>
                </div>

                <div class="form-actions">
                    <a class="button button-secondary" th:href="@{/}">Cancelar</a>
                    <button class="button button-primary" type="submit">Guardar producto</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
