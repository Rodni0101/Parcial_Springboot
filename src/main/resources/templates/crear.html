<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Vista para crear</h1>

    <form th:action="@{/Crear}" th:object="${producto}" method="post">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" th:field="*{nombre}" required>
        <br>

        <label for="categoria">Categoría:</label>
        <input type="text" id="categoria" th:field="*{categoria}" required>
        <br>

        <label for="precio">Precio:</label>
        <input type="number" id="precio" th:field="*{precio}" min="0" step="0.01" required>
        <br>

        <label for="cantidadDisponible">Cantidad disponible:</label>
        <input type="number" id="cantidadDisponible" th:field="*{cantidadDisponible}" min="0" step="1" required>
        <br>

        <label for="descripcion">Descripción:</label>
        <textarea id="descripcion" th:field="*{descripcion}"></textarea>
        <br>

        <button type="submit">Guardar producto</button>
    </form>

    <a th:href="@{/}">Volver al listado</a>
</body>
</html>
